# ПРОФИЛЬ: МАКСИМУМ FPS (AMD E-450 / 2 GB)
# В DDNet нет gfx_maxfps. Лимит = cl_refresh_rate + gfx_refresh_rate.

cl_refresh_rate 120
cl_refresh_rate_inactive 30
gfx_refresh_rate 120
gfx_vsync 0
gfx_fullscreen 1
gfx_screen_width 1024
gfx_screen_height 576
gfx_screen_refresh_rate 0
gfx_high_detail 0
gfx_fsaa_samples 0
gfx_text_overlay 100
gfx_backgroundrender 0
gfx_asyncrender_old 1
gfx_backend OpenGL

cl_predict 1
cl_predict_events 0
cl_antiping 0
cl_showfps 1

cl_showemotes 0
cl_freeze_stars 0
cl_text_entities 0
cl_nameplates 1
cl_nameplates_always 0
cl_nameplates_ids 0
cl_showhud_time_cp_diff 0
cl_showhud_spectator_count 0

cl_auto_demo_record 0
cl_auto_screenshot 0
cl_show_welcome 0
cl_show_start_menu_images 0
cl_skip_start_menu 1
cl_download_skins 0
cl_download_community_skins 0
cl_skins_loaded_max 256
cl_smooth_zoom_time 0
cl_default_zoom 10

snd_enable 0
events 0
br_max_requests 20
br_indicate_finished 0
dbg_graphs 0
